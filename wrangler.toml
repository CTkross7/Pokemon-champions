# Root Cloudflare config for git-connected builds (Cloudflare Workers Builds).
#
# Cloudflare runs the deploy command (`npx wrangler deploy`) from the REPO ROOT,
# so the config must live here and point at the built output under web/. Without
# this file wrangler auto-detects "web/" as the asset dir and tries to upload
# node_modules (122 MiB workerd binary) → "Asset too large" failure.
#
# Dashboard settings that pair with this file:
#   Build command:  cd web && npm install && npm run build
#   Deploy command: npx wrangler deploy      (runs from repo root → uses this file)
#
# Paths are relative to this file (the repo root).
name = "champsnote"
main = "web/worker/index.ts"
compatibility_date = "2026-01-01"

[assets]
directory = "web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# ── Optional community gallery + accounts (Cloudflare D1) ─────────────────────
# Disabled until a D1 database is bound; /api/* returns 503 and the static site
# works normally (login falls back to on-device demo accounts). To enable the
# gallery AND accounts, see docs/DEPLOYMENT.md, then uncomment:
#
# [[d1_databases]]
# binding = "DB"
# database_name = "champsnote"
# database_id = "PASTE_YOUR_DATABASE_ID_HERE"

# ── Optional account login (Google / Apple) ───────────────────────────────────
# Public vars below; secrets (AUTH_SECRET, GOOGLE_CLIENT_SECRET, APPLE_PRIVATE_KEY,
# etc.) go via `npx wrangler secret put ...`. A provider activates only when all
# its credentials are present. See docs/DEPLOYMENT.md.
#
# [vars]
# APP_URL = "https://champsnote.pages.dev"   # public base URL for OAuth redirects
