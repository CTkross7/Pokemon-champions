name: Deploy to Cloudflare Pages

# Builds the web app and deploys it to Cloudflare Pages on every push to the
# development branch. Requires two repository secrets (Settings → Secrets and
# variables → Actions):
#   CLOUDFLARE_API_TOKEN  - a token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID - your Cloudflare account id
# and a Pages project named "champsnote" (create once in the dashboard or it is
# created automatically on first deploy). See docs/DEPLOYMENT.md.
on:
  push:
    branches:
      - claude/pokemon-champion-app-design-ynor2x
  workflow_dispatch: {}

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build web
        working-directory: web
        run: |
          npm install
          npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/dist --project-name=champsnote --branch=main
